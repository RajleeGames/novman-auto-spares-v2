{% extends 'base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1><p>Update customer contact details without changing sales or payment history.</p></div><a class="btn btn-secondary" href="{% url 'customer_detail' customer.id %}">Back</a></div>
<section class="card form-card"><form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="btn btn-primary" type="submit">Save changes</button></div></form></section>
{% endblock %}
