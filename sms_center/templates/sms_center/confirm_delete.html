{% extends "sms_center/shell.html" %}
{% block title %}{{ title }} · SMS{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="sms-delete-shell"><section class="card sms-delete-card"><div class="sms-delete-icon">!</div><h1>{{ title }}</h1><p>Delete <strong>{{ object_name }}</strong>? This action cannot be undone.</p><form method="post">{% csrf_token %}<div class="sms-delete-actions"><a class="btn btn-secondary" href="{% url cancel_url %}">Cancel</a><button class="btn btn-danger" type="submit">Delete</button></div></form></section></div>
{% endblock %}
